<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - BotFastChat</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-card { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 350px; text-align: center; }
        h2 { margin-bottom: 20px; color: #333; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background-color: #007bff; border: none; color: white; border-radius: 4px; font-size: 16px; cursor: pointer; margin-top: 10px; }
        button:hover { background-color: #0056b3; }
        .toggle-btn { background: none; border: none; color: #007bff; cursor: pointer; margin-top: 15px; font-size: 14px; }
        .error { color: red; font-size: 14px; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="login-card">
        <h2 id="form-title">Entrar</h2>
        <form id="auth-form">
            <input type="email" id="email" placeholder="E-mail" required>
            <input type="password" id="password" placeholder="Senha" required>
            <button type="submit" id="submit-btn">Entrar</button>
        </form>
        <button class="toggle-btn" type="button" onclick="toggleMode()">Não tem uma conta? Cadastre-se</button>
        <div id="error-msg" class="error"></div>
    </div>

    <script>
        let isLogin = true;

        function toggleMode() {
            isLogin = !isLogin;
            document.getElementById('form-title').innerText = isLogin ? 'Entrar' : 'Cadastrar';
            document.getElementById('submit-btn').innerText = isLogin ? 'Entrar' : 'Criar Conta';
            document.querySelector('.toggle-btn').innerText = isLogin ? 'Não tem uma conta? Cadastre-se' : 'Já tem uma conta? Faça login';
            document.getElementById('error-msg').innerText = '';
        }

        document.getElementById('auth-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const endpoint = isLogin ? '/api/login' : '/api/register';

            try {
                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Erro na requisição');
                }

                if (isLogin) {
                    localStorage.setItem('userId', data.userId);
                    localStorage.setItem('userEmail', data.email);
                    window.location.href = '/index.html';
                } else {
                    alert('Cadastro realizado com sucesso! Faça login agora.');
                    toggleMode();
                }
            } catch (err) {
                document.getElementById('error-msg').innerText = err.message;
            }
        });
    </script>
</body>
</html>
